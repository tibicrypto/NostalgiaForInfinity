name: Backtest Test9201

on:
  workflow_dispatch:
  push:
    paths:
      - 'test_9201.py'

jobs:
  # Backtest Jobs
  Backtest-Test9201-Binance-Futures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        TIMERANGE:
          - 20251001-20251101
          - 20250901-20251001
          - 20250801-20250901
          - 20250701-20250801
          - 20250601-20250701
          - 20250501-20250601
          - 20250401-20250501
          - 20250301-20250401
          - 20250201-20250301
          - 20250101-20250201
          - 20241201-20250101
          - 20241101-20241201
          - 20241001-20241101
          - 20240901-20241001
          - 20240801-20240901
          - 20240701-20240801
          - 20240601-20240701
          - 20240501-20240601
    steps:
      - uses: actions/checkout@v5
      - name: Inject Proxy Config
        env:
          PROXY: ${{ secrets.FREQTRADE_PROXY2 }}
        run: |
          jq --arg proxy "$PROXY" \
            '.exchange.ccxt_config = { http_proxy: $proxy }' \
            configs/proxy-binance.json > tmp.json && mv tmp.json configs/proxy-binance.json

      - name: Pull docker image
        run: |
          docker pull ghcr.io/iterativv/ci-strategy-backtesting:latest

      - name: Pull Market data and copy to user_data/data
        run: |
          docker pull ghcr.io/iterativv/market-data:binance-futures
          mkdir -p user_data/data
          docker run --rm -v "$PWD/user_data/data:/host_data" ghcr.io/iterativv/market-data:binance-futures \
            bash -c "cp -r /data/* /host_data/"

      - name: Run Backtests
        run: |
          mkdir -p artifacts && chmod 777 artifacts
          export COLUMNS=240
          docker run -v "$PWD:/testing" \
            -v "$PWD/user_data/data:/testing/user_data/data" \
            --rm \
            -w /testing \
            --entrypoint "" \
            -e "COLUMNS=240" \
            -t \
            --env-file .github/workflows/scripts/ci-proxy.env \
            ghcr.io/iterativv/ci-strategy-backtesting:latest \
            python -m pytest \
            tests/backtests \
            -ra -vv -s \
            --log-cli-level=info \
            --artifacts-path=artifacts/ \
            -p no:cacheprovider \
            -n auto \
            -k "test_expected_values_test9201 and ${{ matrix.TIMERANGE }}" \
            --junitxml="artifacts/test9201-binance-futures-${{ matrix.TIMERANGE }}-report.xml"

      - name: Show Backtest Output
        run: cat artifacts/backtest-output-binance-futures-${{ matrix.TIMERANGE }}.txt
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: test9201-binance-futures-testrun-artifacts-${{ matrix.TIMERANGE }}
          path: artifacts/

  Merge-Artifacts:
    if: always()
    needs:
      - Backtest-Test9201-Binance-Futures
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        EXCHANGE: [binance]
        TRADING_MODE: [futures]
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: test9201-${{ matrix.EXCHANGE }}-${{ matrix.TRADING_MODE }}-testrun-artifacts
          pattern: test9201-${{ matrix.EXCHANGE }}-${{ matrix.TRADING_MODE }}-testrun-artifacts-*

  Comment-CI-Results:
    if: always()
    needs: Merge-Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/ci-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          pip install -r tests/ci-requirements.txt

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: test9201-*-testrun-artifacts
          path: artifacts/
          merge-multiple: true

      - name: Generate Summary
        run: |
          python .github/workflows/scripts/create_ci_results.py --artifacts-path artifacts/ --strategy Test9201

      - name: Upload Summary
        uses: actions/upload-artifact@v4
        with:
          name: test9201-ci-summary
          path: artifacts/ci-summary.md

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('artifacts/ci-summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Commit Summary to Repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          mkdir -p ci-results
          cp artifacts/ci-summary.md ci-results/test9201-latest.md
          git add ci-results/test9201-latest.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Test9201 CI results"
          git push
